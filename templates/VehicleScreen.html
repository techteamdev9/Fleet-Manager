/* Overlay */
.modal {
  direction: rtl;
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(6px);
  z-index: 9999;
  animation: fadeIn 0.25s ease;
}

/* Modal Card */
.modal-content {
  background: #ffffff;
  margin: 40px auto;
  width: 90%;
  max-width: 1000px;
  max-height: 90%;
  overflow-y: auto;
  padding: 32px;
  border-radius: 20px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
  font-family: "Segoe UI", system-ui, sans-serif;
  animation: slideUp 0.3s ease;
}

/* Headings */
.modal-content h2 {
  font-size: 24px;
  margin-bottom: 20px;
}

.modal-content h3 {
  margin-top: 30px;
  margin-bottom: 10px;
  font-size: 18px;
  color: #444;
}

/* Close button */
.modal-content > button:first-child {
  background: transparent;
  color: #666;
  font-size: 18px;
  float: left;
  border: none;
  cursor: pointer;
}

.modal-content > button:first-child:hover {
  color: #000;
  transform: scale(1.1);
}

/* Row layout (THIS is the big upgrade) */
.row {
  display: grid;
  grid-template-columns: 180px 1fr 1fr;
  gap: 12px;
  align-items: center;
  margin-bottom: 12px;
  padding: 10px;
  border-radius: 12px;
  transition: background 0.2s;
}

.row:hover {
  background: #f8fafc;
}

/* Labels */
.row label {
  font-size: 14px;
  color: #555;
  font-weight: 500;
}

/* Inputs & selects */
.modal-content input,
.modal-content select,
.modal-content textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  font-size: 14px;
  background: #f8fafc;
  transition: all 0.2s ease;
}

/* Focus state */
.modal-content input:focus,
.modal-content select:focus,
.modal-content textarea:focus {
  outline: none;
  border-color: #3b82f6;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}

/* Textarea sizing */
textarea {
  min-height: 40px;
  resize: vertical;
}

/* File input tweak */
input[type="file"] {
  background: #fff;
  padding: 6px;
}

/* Buttons */
.modal-content button {
  border: none;
  background: #3b82f6;
  color: white;
  padding: 10px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  margin-top: 15px;
  margin-left: 10px;
  transition: all 0.2s ease;
}

.modal-content button:hover {
  background: #2563eb;
  transform: translateY(-1px);
}

/* Secondary button (Close) */
.modal-content button:nth-of-type(3) {
  background: #e5e7eb;
  color: #333;
}

.modal-content button:nth-of-type(3):hover {
  background: #d1d5db;
}

/* Section spacing */
#checklist {
  padding: 10px;
  border-radius: 12px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
}

/* Animations */
@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Overlay */
.issue-modal {

  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.55); /* softer dark blue overlay */

}

/* Modal Card */
.issue-modal-content {

}

/* Headings */
.issue-modal-content h2 {
  margin-bottom: 20px;
  font-size: 24px;
  font-weight: 600;
}

.issue-modal-content h3 {
  margin-top: 30px;

  font-size: 18px;
  color: #444;
}

.issue-modal-content h4 {
  margin-bottom: 10px;
  font-size: 15px;
  color: #666;
}

/* Inputs */
.issue-modal-content input {

  padding: 10px 12px;
  margin: 6px 0;
  border: 1px solid #e2e8f0;
  border-radius: 10px;

/* Close button */

}

.issue-modal-content > button:first-child:hover {

}

/* Sections spacing */

}

/* Grid layout for top inputs */
.issue-modal-content input#issuing_unit,
.issue-modal-content input#receiving_unit {

.issue-modal-content input#receiving_unit {

}

/* Inline date */
.inline-date {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 0;
}

/* Signatures layout */
.signatures {
  display: flex;
  gap: 20px;
  margin-top: 30px;
}

.signatures > div {
  flex: 1;
  background: #f8fafc;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #e2e8f0;
}

/* Checkbox */

  display: flex;

  margin-top: 15px;

/* Animations */

}

.main-btn {
    padding: 14px 28px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 10px;

/* Primary button */

.unit-picker {
  direction: rtl;
  margin: 15px 0;
  font-family: Arial, sans-serif;
}

.unit-picker label {
  display: block;

/* modern dropdown */
.unit-picker select {
  width: 260px;

/* hover */

}

/* focus */
.unit-picker select:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
}

/* make dropdown arrow nicer */
.unit-picker select {
