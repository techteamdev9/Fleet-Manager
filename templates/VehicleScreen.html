<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>מערכת ינשוף</title>
  <link rel="stylesheet" href="/static/css/VehicleScreen.css" />
  <style>
    /* wrapper for horizontal scroll on small screens */
.table-wrapper {
  width: 100%;
  overflow-x: auto;
  margin-top: 20px;
}

/* table base */
table {
  width: 100%;
  border-collapse: collapse;
  font-family: system-ui, -apple-system, Arial, sans-serif;
  background: #ffffff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

/* header */
thead {
  background: #1f2937;
  color: #fff;
}

th {
  padding: 14px;
  text-align: left;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.3px;
}

/* cells */
td {
  padding: 12px;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

/* zebra rows */
tbody tr:nth-child(even) {
  background: #f9fafb;
}

/* hover */
tbody tr:hover {
  background: #eef6ff;
  transition: 0.2s;
}

/* smooth edges */
table, th, td {
  border: none;
}

/* responsive scroll hint */
.table-wrapper::-webkit-scrollbar {
  height: 8px;
}

.table-wrapper::-webkit-scrollbar-thumb {
  background: #ccc;
  border-radius: 10px;
}

.table-wrapper {
  width: 100%;
  overflow-x: auto;

  /* Make horizontal scroll start from the right */
  direction: rtl;
}

/* Keep table normal LTR inside so text aligns correctly */
.table-wrapper table {
  direction: ltr;   /* table content stays left-to-right */
  text-align: left; /* optional: aligns text inside cells */
}
.card {
  color: white;
  font-weight: bold;
}
/* 650 */
.modal {
  direction: rtl;
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 9999;
}

.modal-content {
  background: white;
  padding: 20px;
  margin: 40px auto;
  width: 80%;
  max-height: 90%;
  overflow-y: auto;
}

.row {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

textarea {
  width: 200px;
}

.issue-modal {
  direction: rtl;
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 10000; /* slightly higher */
}

.issue-modal-content {
  background: white;
  padding: 20px;
  margin: 40px auto;
  width: 80%;
  max-height: 90%;
  overflow-y: auto;
}
  </style>
</head>
<body>
  <button onclick="history.back()" style="padding:10px 15px; cursor:pointer;">
    ⬅ Back to Vehicles
  </button>
  <button onclick="openForm()">Open Form 650</button>
  <div id="formModal" class="modal">
    <div class="modal-content">
  
      <h2>Form 650 - ID: <span id="formId"></span></h2>
  
      <!-- Event -->
      <div class="row">
        <label>Event</label>
        <select id="eventType">
          <option>גיוס הרכב</option>
          <option>זיכוי מיחידת הסמך</option>
          <option>שחרור לבעלים</option>
        </select>
        <textarea placeholder="הערות"></textarea>
      </div>
  
      <!-- Vehicle -->
      <div class="row">
        <label>Vehicle Type</label>
        <input type="text" id="vehicleType">
        <textarea placeholder="הערות"></textarea>
      </div>
  
      <div class="row">
        <label>Vehicle Number</label>
        <input type="text" id="vehicleNumber">
        <textarea placeholder="הערות"></textarea>
      </div>
  
      <!-- Date -->
      <div class="row">
        <label>Date</label>
        <input type="date" id="date">
        <textarea placeholder="הערות"></textarea>
      </div>
  
      <!-- Location -->
      <div class="row">
        <label>Location</label>
        <select id="location"></select>
        <textarea placeholder="הערות"></textarea>
      </div>
  
      <!-- Owner -->
      <div class="row">
        <label>Owner Name</label>
        <input type="text">
        <textarea placeholder="הערות"></textarea>
      </div>
  
      <div class="row">
        <label>Owner ID</label>
        <input type="text">
        <textarea placeholder="הערות"></textarea>
      </div>
  
      <div class="row">
        <label>Owner Phone</label>
        <input type="text">
        <textarea placeholder="הערות"></textarea>
      </div>
  
      <!-- Licence -->
      <div class="row">
        <label>Licence Status</label>
        <select>
          <option>תקין</option>
          <option>לא תקין</option>
        </select>
        <textarea placeholder="הערות"></textarea>
      </div>
  
      <!-- Fuel -->
      <div class="row">
        <label>Fuel</label>
        <select>
          <option>מלא</option>
          <option>חצי</option>
          <option>ריק</option>
        </select>
        <textarea placeholder="הערות"></textarea>
      </div>
  
      <!-- Checklist -->
      <h3>Checklist</h3>
      <div id="checklist"></div>
  
      <!-- Lights -->
      <div class="row">
        <label>פנסים</label>
        <select>
          <option>תקין</option>
          <option>לא תקין</option>
        </select>
        <textarea placeholder="הערות"></textarea>
      </div>
  
      <!-- Tires -->
      <div class="row">
        <label>צמיגים</label>
        <select>
          <option>תקין</option>
          <option>לא תקין</option>
        </select>
        <textarea placeholder="הערות"></textarea>
      </div>
  
      <!-- Damage -->
      <div class="row">
        <label>נזקים בפח</label>
        <textarea></textarea>
        <input type="file" multiple>
      </div>
  
      <div class="row">
        <label>נזקים מכניים</label>
        <textarea></textarea>
      </div>
  
      <!-- Assessor -->
      <div class="row">
        <label>המלצת שמאי</label>
        <select>
          <option>הרכב כשיר לקבלה</option>
          <option>לא כשיר לקבלה</option>
          <option>הרכב כשיר לזיכוי</option>
          <option>הרכב לא כשיר לזיכוי</option>
          <option>שחרור</option>
        </select>
        <textarea placeholder="הערות"></textarea>
      </div>
  
      <!-- Signatures -->
      <h3>Signatures</h3>
  
      <div class="row">
        <label>Documenting Person ID</label>
        <input type="text">
      </div>
  
      <div class="row">
        <label>Releasing Signature</label>
        <input type="text">
      </div>
  
      <div class="row">
        <label>Unit Representative</label>
        <input type="text">
      </div>
  
      <button onclick="submitForm()">Submit</button>
      <button onclick="closeForm()">Close</button>
      <div style="margin-top: 20px;">
        <button id="openNextForm" type="button" onclick="openModal()">ניפוק וקבלת רכב</button>
      </div>
    </div>
  </div>

  <div id="issueModal" class="issue-modal">
    <div class="issue-modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
  
      <h2>ניפוק וקבלה - רכב</h2>
  
      <!-- Top inputs -->
      <input type="text" id="issuing_unit" placeholder="יח מנפקת">
      <input type="text" id="receiving_unit" placeholder="יח מקבלת">
  
      <!-- 6 fields -->
      <input type="text" placeholder="קדומת מרץ">
      <input type="number" placeholder="סוג תנועה">
      <input type="text" placeholder="reciever unit Representative">
      <input type="text" placeholder="accept unit Representative">
      <input type="date">
      <input type="number" placeholder="voucher number">
  
      <!-- Dynamic rows -->
      <h3>ציוד</h3>
      <div id="itemsContainer"></div>
      <button type="button" onclick="addRow()">➕</button>
  
      <!-- Accessories -->
      <h3>פירוט אביזרים/ציוד נלווה</h3>
      <div id="accessories"></div>
  
      <!-- Signatures -->
      <div class="signatures">
        <div>
          <h4>אשור יח מנפקת</h4>
        
          <input id="issuer_signature" type="text" placeholder="חתימה">
          <input id="issuer_id" type="number" placeholder="תעודת זהות">
          <input id="issuer_rank" type="text" placeholder="דרגה">
          <input id="issuer_fullname" type="text" placeholder="שם מלא">
        </div>
  
        <div>
          <h4>אשור יח מקבלת</h4>
        
          <input id="receiver_id" type="number" placeholder="תעודת זהות">
          <input id="receiver_rank" type="text" placeholder="דרגה">
          <input id="receiver_fullname" type="text" placeholder="שם מלא">
          <input id="receiver_role" type="text" placeholder="תפקיד">
          <input id="receiver_signature" type="text" placeholder="חתימה">
          <input id="receiver_date" type="date">
          <input id="receiver_form_1006" type="number" placeholder="מספר ט 1006">
        </div>
      </div>
  
      <label>
        <input type="checkbox"> אבזרים כמפורש ב-ט 650
      </label>
      <button type="button" onclick="submitIssueForm()">שמור</button>
    </div>
  </div>
  <div id="app"></div>

  <script src="/static/VehicleScreen.js"></script>
</body>
</html>
