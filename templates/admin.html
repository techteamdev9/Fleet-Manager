<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    /* Vehicle card styling */
    #vehicleCard {
      display:none;
      position:fixed;
      top:50px;
      right:50px;
      width:300px;
      background:#fff;
      border:1px solid #ccc;
      border-radius:8px;
      padding:16px;
      box-shadow:0 2px 8px rgba(0,0,0,0.2);
      z-index:1000;
      max-height:80vh;
      overflow-y:auto;
      font-family: Arial, sans-serif;
    }
    #vehicleCard h3 { margin-top:0; }
    #vehicleCard ul { padding-left:20px; }
    #vehicleCard button { cursor:pointer; background:transparent; border:none; font-size:16px; }

    /* Highlight cars not available */
    .not-available { background:#fdd; }
    #vehiclesTable {
  width: 100%;             /* take full width of container */
  max-width: 100%;         /* don’t overflow */
  border-collapse: collapse;
  table-layout: fixed;     /* force fixed column widths */
  word-wrap: break-word;   /* break long words */
}

#vehiclesTable th, #vehiclesTable td {
  overflow-wrap: break-word; /* ensure content wraps */
  text-align: center;
  font-size: 14px;
}

body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #f4f6f9;
}

.layout {
  display: flex;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  width: 220px;
  background: #1f2937;
  color: white;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.sidebar button {
  background: #374151;
  color: white;
  border: none;
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  cursor: pointer;
}

.sidebar button:hover {
  background: #4b5563;
}

/* Main */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.navbar {
  background: white;
  padding: 15px 25px;
  border-bottom: 1px solid #ddd;
}

.content {
  padding: 20px;
}

/* Cards */
.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  margin-bottom: 20px;
}

/* Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}

/* Table */
.table-wrapper {
  overflow-x: auto;
}

#vehiclesTable {
  width: 100%;
  border-collapse: collapse;
}


.table-wrapper {
  overflow-x: auto;
}
/* Responsive */
@media (max-width: 768px) {
  .sidebar {
    width: 100%;
    flex-direction: row;
    justify-content: space-around;
  }

  .layout {
    flex-direction: column;
  }
.card{
  padding: 10px;
}
body{
  padding: 5px;
}
}
.pagination-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-top: 15px;
}

.pagination-container button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.2s;
  width:100%;
}

.pagination-container button:hover {
  background: #1d4ed8;
}

.pagination-container span {
  font-weight: bold;
  font-size: 16px;
  white-space: nowrap;
}
  </style>
</head>
<body>

  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>Admin</h2>
      <button onclick="window.location.href='/dashboard'">🏠 Dashboard</button>
      <button onclick="goToVehicles()">🚗 Vehicles</button>
      <button onclick="logout()">Logout</button>
    </aside>
  
    <!-- Main Area -->
    <div class="main">
  
      <!-- Top Navbar -->
      <div class="navbar">
        <h2>תצוגה</h2>
      </div>
  
      <div class="content">
        <!-- Date Filter -->
        <div class="card">
          תאריך התחלה: <input type="date" id="fromDate">
          תאריך סוף: <input type="date" id="toDate">
          <button onclick="updateCharts(); loadVehicles();">חפש</button>
        </div>
  
        <!-- Charts -->
        <div class="stats-grid">
          <div class="card">
            <h3>קצב גיוס לפי פעימות</h3>
            <canvas id="timeChart"></canvas>
          </div>
  
          <div class="card">
            <h3>סטאטוס כלים</h3>
            <canvas id="pieChart"></canvas>
          </div>
        </div>
  
        <!-- Vehicles Table -->
        <div class="card">
          <h3>רכבים</h3>
          <div class="table-wrapper">
            <table id="vehiclesTable">
              <thead>
                <tr>
                  <th>מספר רישוי</th>
                  <th>קוד כלי</th>
                  <th>סטאטוס</th>
                  <th>זמין לשירות</th>
                  <th>מידע</th>
                </tr>
              </thead>
              <tbody id="vehiclesTableBody"></tbody>
            </table>
          </div>
        </div>
        <div class="pagination-container">
          <button id="prevPageAdmin">קודם</button>
          <span id="currentPageAdmin">1</span>
          <button id="nextPageAdmin">הבא</button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Vehicle Info Card stays exactly same -->
  <div id="vehicleCard">
    <button id="closeCard">✖</button>
    <div id="vehicleCardContent"></div>
  </div>
<script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
