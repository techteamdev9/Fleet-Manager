<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicles</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      padding: 20px;
    }

    h2 {
      color: #2c3e50;
    }

    input,
    select,
    button {
      padding: 8px;
      margin: 5px;
      font-size: 16px;
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: right;
    }

    th {
      background-color: #3498db;
      color: #fff;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #f7f9fc;
      cursor: pointer;
    }

    #vehicleTable {
  width: 100%;             /* take full width of container */
  max-width: 100%;         /* don’t overflow */
  border-collapse: collapse;
  table-layout: fixed;     /* force fixed column widths */
  word-wrap: break-word;   /* break long words */
}

#vehicleTable th, #vehicleTable td {
  overflow-wrap: break-word; /* ensure content wraps */
  text-align: center;
  font-size: 14px;
}

.container {
  max-width: 1200px;
  margin: auto;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  margin-bottom: 20px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.table-wrapper {
  overflow-x: auto;
}

@media (max-width: 768px) {
  .page-header {
    flex-direction: column;
    gap: 10px;
  }

  button {
    width: 100%;
    margin-top: 5px;
  }
  .card{
    padding: 5px;
  }
}

#excelUploadSection input[type="file"] {
  margin-top: 5px;
}

#excelUploadSection button {
  margin-top: 5px;
}
.pagination-container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-top: 15px;
}

.pagination-container button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.2s;
  }

.pagination-container button:hover {
  background: #1d4ed8;
}

.pagination-container span {
  font-weight: bold;
  font-size: 16px;
  white-space: nowrap; /* Prevent wrapping to new line */
  min-width: 50px;     /* Ensure enough space for "X / Y" */
  text-align: center;
}
  </style>
</head>

<body>

  <div class="container">

    <!-- Header -->
    <div class="page-header">
      <h2>רשימת רכבים</h2>
      <div>
        <button id="adminDashboardBtn" style="display:none;" onclick="goToAdmin()">📊 Admin</button>
        <button onclick="logout()">🚪 התנתקות</button>
      </div>
    </div>
  
    <!-- Search Card -->
    <div class="card">
      <input id="search" placeholder="חפש רכב">
      <button onclick="refreshTable()">חפש</button>
      <button onclick="clearSearch()">נקה</button>
    </div>
  
      <!-- Excel Upload -->
  <div id="excelUploadSection" style="display:none; margin-top:10px;">
    <input type="file" id="excelFile" accept=".xlsx,.xls">
    <button onclick="uploadExcel()">Upload Excel</button>
  </div>
    <!-- Table Card -->
    <div class="card table-wrapper">
      <table id="vehicleTable">
        <thead>
          <tr>
            <th>מזהה</th>
            <th>מספר רישוי</th>
            <th>קוד כלי</th>
            <th>סטטוס</th>
            <th>זמינות</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="pagination-container">
      <button id="prevPage">« Previous</button>
      <span id="currentPage">1</span>
      <button id="nextPage">Next »</button>
    </div>
    <!-- Form Card -->
    <div class="card" id="vehicleForm">
      <h3>טופס רכב</h3>
      <input id="license" placeholder="מספר רישוי">
      <input id="toolCode" placeholder="קוד כלי">
      <select id="statusSelect"></select>
      <br><br>
      <button onclick="addVehicle()">הוספה</button>
      <button onclick="updateVehicle()">עדכון</button>
      <button onclick="deleteVehicle()">מחיקה</button>
      <button onclick="clearForm()">ניקוי</button>
    </div>
  
  </div>

  <script src="{{ url_for('static', filename='vehicles.js') }}"></script>
</body>

</html>
