<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicles</title>
  <!-- <link href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator.min.css" rel="stylesheet"> -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      padding: 20px;
    }

    h2 {
      color: #2c3e50;
    }

    input,
    select,
    button {
      padding: 8px;
      margin: 5px;
      font-size: 16px;
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: right;
    }

    th {
      background-color: #3498db;
      color: #fff;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #f7f9fc;
      cursor: pointer;
    }

    #vehicleTable {
      width: 100%;
      /* take full width of container */
      max-width: 100%;
      /* don’t overflow */
      border-collapse: collapse;
      table-layout: fixed;
      /* force fixed column widths */
      word-wrap: break-word;
      /* break long words */
    }

    #vehicleTable th,
    #vehicleTable td {
      overflow-wrap: break-word;
      /* ensure content wraps */
      text-align: center;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      margin-right: 260px;
      /* space for sidebar */

    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    @media (max-width: 768px) {
      .page-header {
        flex-direction: column;
        gap: 10px;
      }

      button {
        /* width: 100%; */
        margin-top: 5px;
      }

      .card {
        padding: 5px;
      }
    }

    #excelUploadSection input[type="file"] {
      margin-top: 5px;
    }

    #excelUploadSection button {
      margin-top: 5px;
    }

    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
    }

    .pagination-container button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .pagination-container button:hover {
      background: #1d4ed8;
    }

    .pagination-container span {
      font-weight: bold;
      font-size: 16px;
      white-space: nowrap;
      /* Prevent wrapping to new line */
      min-width: 50px;
      /* Ensure enough space for "X / Y" */
      text-align: center;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: white;
      padding: 24px;
      border-radius: 12px;
      width: 400px;
      max-width: 95%;
    }

    .vehicle-edit-row td {
      background: #fafafa;
      padding: 8px 14px;
    }

    .btn-edit-vehicle {
      padding: 6px 12px;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .btn-edit-vehicle:hover {
      background: #1d4ed8;
    }

    /* Hide the real file input */
    #excelFile {
      display: none;
    }

    /* Style the label like a button */
    .file-upload-label {
      display: inline-block;
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      margin-right: 10px;
      transition: background 0.2s;
    }

    .file-upload-label:hover {
      background-color: #45a049;
    }

    /* Optional: show the selected file name */
    .file-name {
      font-style: italic;
    }

    .disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* sidebar */
    /* .sidebar {
  width: 220px;
  background: #224d8a;
  color: white;
  padding: 20px;
  display: flex;
  flex-direction: column;
} */
    .sidebar {
      width: 220px;
      background: #224d8a;
      color: white;
      padding: 20px;

      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;

      display: flex;
      flex-direction: column;
      /* buttons stacked */
    }

    .sidebar button {
      background: #374151;
      color: white;
      border: none;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .sidebar button:hover {
      background: #4b5563;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
        padding: 15px;
        position: static;
      }

      .edit-btn {
        width: 100%;
      }

      .delete-btn {
        width: 100%;
      }

      body {
        padding: 5px;
      }

      .container {
        margin-right: 0;
      }

      * {
        box-sizing: border-box;
      }
    }

    body {
      padding-top: 1px;
      margin: 0px;
    }
    /* Outer box */
.upload-box {
  display: flex;
  align-items: center;
  justify-content: space-between;

  border: 2px dashed #cbd5e1;
  border-radius: 10px;
  padding: 15px;
  margin-top: 10px;
  background: #f9fafb;
}

/* Keep file + name in one row */
.file-upload-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Hide default ugly input */
.file-upload-wrapper input[type="file"] {
  display: none;
}

/* Styled button */
.file-upload-label {
  background: #224d8a;
  color: white;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
}

/* File name */
#excelFileName {
  font-weight: bold;
}

/* Upload button */
.upload-btn {
  background: #16a34a;
  color: white;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
}
/* hide remove button by default */
.remove-btn {
  display: none;
  background: transparent;
  border: none;
  color: #dc2626;
  font-weight: bold;
  cursor: pointer;
}

/* optional spacing */
.file-upload-wrapper {
  display: flex;
  align-items: center;
  gap: 10px;
}
.upload-box {
  direction: rtl;
}
/* small screens */
@media (max-width: 768px) {
  .file-upload-wrapper {
    flex-direction: column;
    align-items: flex-start;
  }

  #excelFileName {
    margin-top: 5px;
  }

  .remove-btn {
    margin-top: 5px;
  }
}

.table-scroll {
    overflow-x: auto;
    width: 100%;
}

#vehicleTable {
    min-width: 1800px;
    border-collapse: collapse;
    table-layout: auto;
}

#vehicleTable th,
#vehicleTable td {
    white-space: nowrap;
    padding: 8px 12px;
    text-align: center;
    font-size: large;
}

#vehicleTable th {
    background: #f2f2f2;
    font-weight: bold;
}

#vehicleTable td {
    max-width: 250px;
    overflow: hidden;
    text-overflow: ellipsis;
}
#vehicleTable th {
    background: #f2f2f2;
    color: #222;
    font-weight: bold;
    white-space: nowrap;
    padding: 10px 14px;
    text-align: center;
}

.header-excel_index{
  background-color: #478ed4 !important;

}
.header-license_number {

.header-recruitment_date{

.header-release_batch{

.header-excel_status{

.header-notes {

.header-available {

.header-actions {

}

#vehicleTable thead th {
    height: 60px;
    padding: 10px 8px;
    vertical-align: middle;
    text-align: center;
    white-space: normal;
}

  </style>
</head>

    <button onclick="window.location.href='/vehicles-page1'">

    </button>

      <input id="search" placeholder="חפש רכב">
      <button onclick="refreshTable()">חפש</button>
      <button onclick="clearSearch()">נקה</button>

    <div class="card table-wrapper">
      <div class="table-scroll">
        <table id="vehicleTable">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <div class="pagination-container">
      <button id="prevPage">« הקודם</button>
      <span id="currentPage">1</span>
      <button id="nextPage">הבא »</button>
    </div>
    <!-- Form Card -->
    <div class="card" id="vehicleForm">
      <h3>טופס רכב</h3>
      <input id="license" placeholder="מספר רישוי">
      <input id="toolCode" placeholder="קוד כלי">
      <select id="statusSelect"></select>
      <br><br>
      <button onclick="addVehicle()">הוספה</button>
      <button onclick="updateVehicle()">עדכון</button>
      <button onclick="deleteVehicle()">מחיקה</button>
      <button onclick="clearForm()">ניקוי</button>
    </div>

  </div>

  <div id="vehicleModalOverlay" class="modal-overlay">
    <div class="modal">
      <h3 id="vehicleModalTitle">עריכת רכב</h3>

      <!-- IMPORTANT: id="vehicleForm" MUST BE A <form> -->
      <form id="vehicleForm1">

        <input type="hidden" id="vehicleId">

        <label>רישוי</label>
        <input id="license1">
        <br>
        <label>קוד כלי</label>
        <input id="toolCode1">
        <br>
        <label>סטטוס</label>
        <select id="statusSelect1">
          <option value="פעיל">פעיל</option>
          <option value="נמכר">נמכר</option>
          <option value="הוצא משימוש">הוצא משימוש</option>
          <option value="גויס">גויס</option>
          <option value="שוחרר">שוחרר</option>
          <option value="בדרך לשחרור">בדרך לשחרור</option>
          <option value="נופק">נופק</option>
          <option value="זיכוי">זיכוי</option>
          <option value="הופץ - תקין">הופץ - תקין</option>
          <option value="הופץ - לא תקין">הופץ - לא תקין</option>
          <option value="במוסך">במוסך</option>

        </select>
        <br>
        <label>קוד יחידה</label>
        <input type="text" id="unitcode" placeholder="קוד יחידה">
        <br>
        <label>סוג כלי</label>
        <input type="text" id="vehicleType" placeholder="סוג כלי">
        <br>
        <label>
          <input type="checkbox" id="vehicleAvailable">
          ניתן לגיוס
        </label>
        <button type="button" class="clear-btn" onclick="clearVehicleForm()">נקה</button>
      </form>

      <div class="modal-actions">
        <button type="button" onclick="saveVehicle()">שמור</button>
        <button type="button" onclick="closeVehicleModal()">ביטול</button>
        <!-- Excel Upload -->
        <div id="excelUploadSection" class="upload-box">

          <div class="file-upload-wrapper">
            <input type="file" id="excelFile" accept=".xlsx,.xls,.xlsb,application/vnd.ms-excel.sheet.binary.macroEnabled.12">
            
            <label for="excelFile" class="file-upload-label">בחר קובץ</label>
            
            <span id="excelFileName"></span>
            
            <button type="button" id="removeFileBtn" class="remove-btn">הסר</button>
          </div>
        
          <button class="upload-btn" onclick="uploadExcel()">העלאת קובץ</button>
        
        </div>
      </div>

    </div>
  </div>
