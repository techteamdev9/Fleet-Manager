<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מערכת ינשוף - התחברות</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f4f6f9; padding: 30px; text-align: center; }
    #loginDiv { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    #loginDiv input{width:90%}
    input { width: 100%; padding: 10px; margin: 8px 0; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
    button { padding: 10px 20px; font-size: 16px; border-radius: 4px; border: none; background: #3498db; color: #fff; cursor: pointer; }
    button:hover { background: #2980b9; }
    
  </style>
</head>
<body>
  <div id="loginDiv">
    <h2>מערכת ינשוף</h2>
    <input type="text" id="username" placeholder="שם משתמש">
    <input type="password" id="password" placeholder="סיסמה">
    <button type="button" onclick="login()">התחברות</button>
  </div>

  <script>
    const API = window.location.origin;

    async function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;

      const res = await fetch(`${API}/login`, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p })
      });

      if (!res.ok) return alert("Invalid credentials");

      const user = await res.json();
      sessionStorage.setItem("user", JSON.stringify(user));

      window.location.href = "/dashboard";
    }
  </script>
</body>
</html>
